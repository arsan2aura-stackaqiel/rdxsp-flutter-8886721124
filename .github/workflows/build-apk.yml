name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Validate project
        run: |
          test -f pubspec.yaml || (echo "❌ pubspec.yaml missing" && exit 1)
          test -d android || (echo "❌ android/ missing" && exit 1)
          echo "✅ Project valid"
          echo ""
          echo "=== PUBSPEC.YAML ==="
          cat pubspec.yaml

      - name: Auto-fix common issues
        run: |
          cd android
          if ! grep -q "namespace" app/build.gradle 2>/dev/null; then
            APP_ID=$(grep "applicationId" app/build.gradle | head -1 | sed 's/.*"//;s/".*//')
            if [ -n "$APP_ID" ]; then
              sed -i "s/android {/android {\n    namespace \"$APP_ID\"/" app/build.gradle || true
            fi
          fi
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' app/build.gradle || true
          cd ..
        continue-on-error: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (LATEST)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Flutter doctor
        run: flutter doctor -v
        continue-on-error: true

      - name: Pre-setup
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        id: build1
        run: flutter build apk --release --no-tree-shake-icons
        continue-on-error: true

      - name: Retry Build
        if: steps.build1.outcome == 'failure'
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
        continue-on-error: true

      - name: Build Debug (fallback)
        if: failure()
        run: |
          flutter clean
          flutter pub get
          flutter build apk --debug

      - name: Find APK
        if: always()
        id: find
        run: |
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"

      - uses: actions/upload-artifact@v4
        if: steps.find.outputs.path != ''
        with:
          name: apk
          path: ${{ steps.find.outputs.path }}

      - uses: softprops/action-gh-release@v2
        if: steps.find.outputs.path != ''
        with:
          tag_name: build-${{ github.run_number }}
          files: ${{ steps.find.outputs.path }}

      - name: Fail if no APK
        if: steps.find.outputs.path == ''
        run: exit 1
